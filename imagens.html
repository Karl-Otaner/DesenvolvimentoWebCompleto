<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
</head>
<body>

    <!--
      img - IMaGe (imagem)
       src - Source (fonte, origem)
       alt - Alternative text (texto alternativo)
       tiplos de arquivos de imagem: .jpg, .jpeg, .png, .gif, .svg
    -->

    <!-- 
     figure (figure) -> Usada para definir uma foto,
     ilustração e etc.

    -->
    <figure>
        <img src="arquivos/imagens/praia.jpeg"
            alt="Imagem de uma praia vista do alto" 
            width="300"
            title="Praia da Boa Vista">

        <figcaption>Praia da Boa Vista</figcaption>
    </figure>


</body>
</html>
