<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
    <b>(bold - Negrito) representa um texto diferente do normal
    <strong> (strong - Forte) representa um texto com importância
    <em>(emphasis - Ênfase) coloca alguma ênfase no texto
    <mark>(mark - Marcar) representa um texto marcado
    -->
    <h2>Formatação de Textos</h2>
    Esse é um texto <b>negrito</b><br>
    Esse é um texto <strong>forte</strong> <br>
    Esse é um texto <i>itálico</i> <br>
    Esse é um texto <em>ênfase</em> <br>
    Esse é um texto <mark>marcado</mark> <br>

    <!--
    <u>(underline - Sublinhado) texto sublinhado
    <del>(deleted - Deletado) texto com marcação de apagado
    -->
    Esse é um texto <u>sublinhado</u> <br>
    Esse é um texto <del>apagado</del> <br> 

    <!--
    <sup>(superscript - Sobrescrito) texto sobrescrito
    <sub>(subscript - Subscrito) texto subscrito
    -->
    <h2>Diferentes tipos de caracteres</h2>
    Sobrescrito: 10<sup>2</sup> <br>
    Subscrito: H<sub>2</sub>O <br>
 


</body>
</html>
