<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    
    <h1>Tabelas</h1>
    <!-- 
     table -> Tabela
     tr -> Table Row (Linha da Tabela)
     td -> Table Data (Dado da Tabela) * Table Cell (Célula da Tabela)
     th -> Table Header (Cabeçalho da Tabela)   
    -->  
     <!-- Nâo utilizar o border, apenas para fins de estudo
      mais a frente iremos utilizar o CCS -->

    <table border="1">
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>

        </tr>
        <tr>
            <td>Notebook</td>
            <td>1</td>
            <td>R$ 2000</td>
        </tr>
        <tr>
            <td>Tablet</td>
            <td>2</td>
            <td>R$ 1000</td>
        </tr>

        <!--
            colspan -> Extensão de colunas
            rowspan -> Extensão de Linhas
        -->
        <tr>
            <td rowspan="2">Desconto</td>
            <td colspan="2">Cupom 1 - R$ 20</td>
        </tr>
        <tr>
            <td colspan="2">Cupom 2 - R$ 20</td>
        </tr>

</body>
</html>
