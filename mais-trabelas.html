<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mais Tabelas</title>

</head>
<body>
    <h1>Mais Tabelas</h1>
    <!--
    caption -> Legenda / título de tabela
    theader -> Table Header -> Cabeçalho da tebela
    tbody -> Table Body -> Corpo da tabela
    tfooter -> Table Footer -> Rodapé da tebela 
     -->
</body>

    <table border="1">
        <caption>Listagem de produtos</caption>
        <thead>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
        </thead>

        <tbody>
             <tr>
            <td>Notebook</td>
            <td>1</td>
            <td>R$ 2000</td>
        </tr>
        <tr>
            <td>Tablet</td>
            <td>2</td>
            <td>R$ 1000</td>
        </tr>

        <tfoot>
            <tr>
                <td>Total</td>
                <td colspan="2">R$ 3000</td>
            </tr>

        </tfoot>
        </tbody>
    </table>

</html>
